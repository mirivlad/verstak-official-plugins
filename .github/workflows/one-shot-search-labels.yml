name: one-shot-search-labels

on:
  push:
    branches:
      - audit/search-provider-labels

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/search-provider-labels
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add provider-owned file and folder labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('plugins/search/frontend/src/index.js')
          text = path.read_text()
          old = """      categoryId: result.type === 'folder' ? 'folders' : 'files',\n      score: result.matchType === 'Content match' ? 80 : 100\n"""
          new = """      categoryId: result.type === 'folder' ? 'folders' : 'files',\n      categoryLabel: api && api.i18n && typeof api.i18n.t === 'function'\n        ? api.i18n.t(result.type === 'folder' ? 'ui.folder' : 'ui.file', null, result.type === 'folder' ? 'Folder' : 'File')\n        : (result.type === 'folder' ? 'Folder' : 'File'),\n      score: result.matchType === 'Content match' ? 80 : 100\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one Search result normalization anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify official plugins
        run: bash scripts/check.sh
      - name: Commit product change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/search/frontend/src/index.js
          git diff --cached --check
          git commit -m 'search: let provider label file result categories'
          git push origin HEAD:audit/search-provider-labels
