name: one-shot-retire-folder-appearance

on:
  push:
    branches:
      - audit/retire-folder-appearance

permissions:
  contents: write

concurrency:
  group: one-shot-retire-folder-appearance
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/retire-folder-appearance

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false

      - name: Apply contribution validation to build
        run: python3 .github/scripts/patch_manifest_validation.py

      - name: Reject a synthetic unknown contribution
        run: |
          tmp="$(mktemp)"
          cat > "$tmp" <<'JSON'
          {"contributes":{"workspaceTreeNodeActions":[]}}
          JSON
          if python3 scripts/validate_manifest.py "$tmp"; then
            echo "validator accepted an unknown contribution point" >&2
            exit 1
          fi

      - name: Build official plugin set
        run: bash scripts/build.sh

      - name: Assert retired plugin is absent
        run: |
          test ! -d plugins/folder-appearance
          test ! -d dist/folder-appearance
          test "$(find plugins -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 14

      - name: Commit permanent build contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.sh scripts/validate_manifest.py
          git diff --cached --check
          git commit -m "build: reject unknown plugin contribution points"
          git push origin HEAD:audit/retire-folder-appearance
