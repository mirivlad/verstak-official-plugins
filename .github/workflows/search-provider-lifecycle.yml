name: search-provider-lifecycle

on:
  push:
    branches:
      - audit/search-provider-lifecycle

permissions:
  contents: write

concurrency:
  group: search-provider-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out official plugins
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out current SDK
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-sdk
          ref: main
          path: verstak-sdk

      - name: Put SDK beside official plugins
        run: mv verstak-sdk ../verstak-sdk

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python schema dependency
        run: python3 -m pip install --quiet jsonschema

      - name: Apply lifecycle patch
        run: python3 .github/scripts/search_provider_lifecycle.py

      - name: Search lifecycle smoke
        run: node scripts/smoke-search-plugin.js

      - name: Full official plugin checks
        run: bash scripts/check.sh

      - name: Verify source contract
        run: |
          test "$(grep -c "api.commands.register(SEARCH_COMMAND_ID" plugins/search/frontend/src/index.js)" -eq 1
          grep -q 'activate: activateSearchProvider' plugins/search/frontend/src/index.js
          grep -q "workspaceRootPath || ''" plugins/search/frontend/src/index.js
          git diff --check

      - name: Remove one-shot machinery and commit
        run: |
          rm .github/scripts/search_provider_lifecycle.py .github/workflows/search-provider-lifecycle.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep Search provider active in background'
          git push origin HEAD:audit/search-provider-lifecycle
