name: Apply Projects Scope v3

on:
  push:
    branches: [projects-scope-v3-apply]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/projects-scope-v3.part00 .github/projects-scope-v3.part01 .github/projects-scope-v3.part02 .github/projects-scope-v3.part03 > /tmp/projects-scope-v3.patch
          git apply --check /tmp/projects-scope-v3.patch
          git apply /tmp/projects-scope-v3.patch
          rm .github/projects-scope-v3.part00 .github/projects-scope-v3.part01 .github/projects-scope-v3.part02 .github/projects-scope-v3.part03 .github/workflows/apply-projects-scope-v3.yml
      - name: Check
        run: ./scripts/check.sh
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "projects: scope resources inside Deals"
          git push origin HEAD:projects-scope-v3-apply
