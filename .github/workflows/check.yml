name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-projects:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/projects-mvp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/projects-mvp
      - name: Apply prepared Projects patch once
        run: |
          base64 -d .github/projects-mvp.patch.gz.b64 | gzip -d > /tmp/projects-mvp.patch
          if git apply --check /tmp/projects-mvp.patch; then
            git apply --index /tmp/projects-mvp.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat: add Projects management plugin"
            git push origin HEAD:feat/projects-mvp
          else
            echo "Patch already applied; nothing to bootstrap."
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      # scripts/check.sh validates every plugin manifest against
      # ../verstak-sdk/schemas/manifest.json, so the SDK must sit beside this
      # repository exactly as it does in a local workspace. Without it the
      # script skips manifest validation instead of failing, which would make
      # the job green for the wrong reason.
      - uses: actions/checkout@v4
        with:
          path: verstak-official-plugins

      - uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-sdk
          path: verstak-sdk

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Confirm the SDK schema is reachable
        run: test -f verstak-sdk/schemas/manifest.json

      - name: Build shipping plugin packages
        run: bash scripts/build.sh
        working-directory: verstak-official-plugins

      - name: Validate packaged frontend assets
        run: python3 scripts/check-packaged-frontend-assets.py
        working-directory: verstak-official-plugins

      - name: Manifests, locales and plugin smokes
        run: bash scripts/check.sh
        working-directory: verstak-official-plugins

  # A manifest change here can break the desktop shell without any commit
  # landing there. The desktop icon set is generated from these manifests, so
  # retiring a plugin or renaming its icon leaves the committed core.js/sprite.js
  # stale in a repository whose own CI has no reason to run. That happened twice:
  # the folder-appearance retirement broke desktop main 29 minutes after desktop
  # went green, and nobody saw it until someone pushed there days later.
  #
  # This job runs the desktop's own contract check against *this* branch, so the
  # break surfaces on the pull request that causes it.
  desktop-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verstak-official-plugins

      - uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak
          path: verstak-desktop

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install desktop frontend dependencies
        run: npm ci
        working-directory: verstak-desktop/frontend

      - name: Desktop icon assets still match these manifests
        run: node scripts/generate-icon-assets.mjs --check
        working-directory: verstak-desktop
