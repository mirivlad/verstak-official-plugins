name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/project-capability-adapters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-capability-adapters
      - name: Apply prepared capability patch once
        run: |
          if git apply --check .github/project-capability-adapters.patch; then
            git apply --index .github/project-capability-adapters.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat: expose notes and todo capability operations"
            git push origin HEAD:feat/project-capability-adapters
          else
            echo "Patch already applied; nothing to bootstrap."
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      # scripts/check.sh validates every plugin manifest against
      # ../verstak-sdk/schemas/manifest.json, so the SDK must sit beside this
      # repository exactly as it does in a local workspace. Without it the
      # script skips manifest validation instead of failing, which would make
      # the job green for the wrong reason.
      - uses: actions/checkout@v4
        with:
          path: verstak-official-plugins

      - uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-sdk
          path: verstak-sdk

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Confirm the SDK schema is reachable
        run: test -f verstak-sdk/schemas/manifest.json

      - name: Build shipping plugin packages
        run: bash scripts/build.sh
        working-directory: verstak-official-plugins

      - name: Validate packaged frontend assets
        run: python3 scripts/check-packaged-frontend-assets.py
        working-directory: verstak-official-plugins

      - name: Manifests, locales and plugin smokes
        run: bash scripts/check.sh
        working-directory: verstak-official-plugins

  desktop-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verstak-official-plugins

      - uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak
          path: verstak-desktop

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install desktop frontend dependencies
        run: npm ci
        working-directory: verstak-desktop/frontend

      - name: Desktop icon assets still match these manifests
        run: node scripts/generate-icon-assets.mjs --check
        working-directory: verstak-desktop
