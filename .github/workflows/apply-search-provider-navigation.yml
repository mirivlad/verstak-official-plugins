name: apply-search-provider-navigation

on:
  push:
    branches:
      - fix/search-provider-navigation
    paths:
      - '.github/workflows/apply-search-provider-navigation.yml'

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out official plugins
        uses: actions/checkout@v4
        with:
          path: work/verstak-official-plugins
          ref: fix/search-provider-navigation
          fetch-depth: 0

      - name: Check out SDK schema
        uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-sdk
          path: work/verstak-sdk

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare exact Search contract anchor
        working-directory: work/verstak-official-plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-search-providers.js')
          text = path.read_text()
          old = """if (providerCount !== 4) throw new Error(`expected 4 official Search providers, found ${providerCount}`);\nconsole.log(`OK ${providerCount} Search providers use declared background commands`);\n"""
          new = """const byId = new Map(manifests.map((row) => [row.manifest.id, row]));
          function fail(message) { throw new Error(message); }
          const searchRow = byId.get('verstak.search');
          if (!searchRow) fail('verstak.search manifest missing');
          const source = fs.readFileSync(path.join(root, searchRow.name, searchRow.manifest.frontend.entry), 'utf8');
          if (!source.includes("commands.register(SEARCH_COMMAND_ID")) fail("Search bundle must register its provider command during activation");
          if (!source.includes("api.events.subscribe('file.changed'")) fail("Search provider index must invalidate on file.changed");
          if (!source.includes("api.commands.executeFor(provider.pluginId, provider.handler")) fail("Search workspace must aggregate declared Search providers");

          if (providerCount !== 4) throw new Error(`expected 4 official Search providers, found ${providerCount}`);
          console.log(`OK ${providerCount} Search providers use declared background commands`);
          """
          if text.count(old) != 1:
              raise SystemExit('Search checker anchor drifted')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply product patch
        working-directory: work/verstak-official-plugins
        run: python3 .github/scripts/apply-search-provider-navigation.py

      - name: Verify intended source boundaries
        working-directory: work/verstak-official-plugins
        run: |
          grep -F "loadProviderEntries(api, rootPath)" plugins/search/frontend/src/index.js
          grep -F "api.capabilities.get(FILES_CAPABILITY_ID)" plugins/search/frontend/src/index.js
          grep -F "api.workspaces.resolvePath(cleanPath(result.path))" plugins/search/frontend/src/index.js
          grep -F "toolRequest: { type: 'open-folder', path: localPath }" plugins/search/frontend/src/index.js
          grep -F "toolRequest && toolRequest.type === 'open-folder'" plugins/files/frontend/src/index.js

      - name: Run official plugin checks
        working-directory: work/verstak-official-plugins
        run: bash scripts/check.sh

      - name: Commit only product changes
        working-directory: work/verstak-official-plugins
        run: |
          rm -f .github/scripts/apply-search-provider-navigation.py
          rm -f .github/workflows/apply-search-provider-navigation.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix: make Search provider navigation generic and responsive'
          git push origin HEAD:fix/search-provider-navigation
