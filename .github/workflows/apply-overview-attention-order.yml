name: apply-overview-attention-order

on:
  push:
    branches: [audit/overview-attention-order]
    paths:
      - '.github/scripts/apply_overview_attention_order.py'
      - '.github/workflows/apply-overview-attention-order.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/overview-attention-order
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: mirivlad/verstak-sdk
          path: ../verstak-sdk
      - name: Apply order semantics
        run: python3 .github/scripts/apply_overview_attention_order.py
      - name: Check official plugins
        run: bash scripts/check.sh
      - name: Remove one-shot machinery and commit
        run: |
          rm -f .github/scripts/apply_overview_attention_order.py .github/workflows/apply-overview-attention-order.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: preserve Overview attention priority'
          git push origin HEAD:audit/overview-attention-order
